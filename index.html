<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E284D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Car Upgrade">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<title>Car Upgrade Calculator</title>
<style>
:root{
  --theme:#0E284D;
  --bg:#F5F5F7;
  --card:#FFFFFF;
  --text:#111111;
  --muted:#6F6F73;
  --line:#D7D7DA;
  --selected:#E2E2E4;
  --calc:#F4F4F5;
  --shadow:0 10px 28px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
.app{width:min(520px,100%);margin:0 auto;padding:10px 16px 10px}
.topbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:16px;margin:0 2px 9px}
.topbar h1{font-size:27px;line-height:1.08;letter-spacing:-.55px;margin:0;font-weight:800;white-space:nowrap}
.top-action{appearance:none;border:0;background:transparent;min-width:50px;min-height:40px;padding:0 3px;color:#66666A;font-size:18px;font-weight:600;cursor:pointer}
.top-action:active{opacity:.55}
.card{background:var(--card);border-radius:28px;padding:14px 20px 14px;box-shadow:var(--shadow)}
.section-title{font-size:17px;font-weight:700;margin:0 0 7px;letter-spacing:-.1px}
.section{margin-bottom:4px}.section:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.metric-field{min-width:0}.metric-field .metric-label{display:block;font-size:14px;font-weight:700;margin:0 0 5px;line-height:1.2;color:#2F2F31}.metric-display{height:46px;display:flex;align-items:center;min-width:0;padding:0 4px;font-size:27px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.3px;overflow:hidden}
.field{margin-bottom:7px}.field:last-child{margin-bottom:0}
label{display:block;font-size:14px;font-weight:700;margin:0 0 5px;line-height:1.2;color:#2F2F31}
input[type="text"],input[type="number"]{width:100%;height:46px;border:1px solid var(--line);border-radius:17px;background:#fff;padding:0 15px;font-size:18px;outline:none}
.money{position:relative}.money::before{content:'$';position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;line-height:1;color:#77777A;pointer-events:none;z-index:1}
.money>input.money-input{padding-left:46px;padding-right:14px;font-variant-numeric:tabular-nums}
.suffix{position:relative}.suffix::after{content:'yr';position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:15px;color:#77777A;pointer-events:none}.suffix>input{padding-right:42px;font-variant-numeric:tabular-nums;text-align:left}
input:focus{border-color:#AFAFB3;box-shadow:0 0 0 2px rgba(0,0,0,.04)}
input.calc{background:var(--calc);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
input.calc.manual{background:#fff;border-color:#AFAFB3}
.rule{height:1px;background:#EEEEF0;margin:8px 0}
.seg-label{font-size:14px;font-weight:700;margin:0 0 5px;color:#2F2F31}
.segment{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.segment button,.segment input{height:42px;border:1px solid var(--line);border-radius:17px;background:#fff;font-size:16px;font-weight:700;text-align:center;padding:0 6px}
.segment button{cursor:pointer}.segment button.active{background:var(--selected);border-color:#C6C6C9}.segment input.custom-active{background:var(--selected);border-color:#C6C6C9}
.segment input::placeholder{color:transparent}
.results-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px}
.result-tile{min-height:82px;border:1px solid var(--line);border-radius:19px;background:#F8F8F8;padding:11px 14px;display:flex;flex-direction:column;justify-content:space-between}
.result-tile .name{font-size:14px;font-weight:700;line-height:1.15;color:#2F2F31}.result-tile .value{font-size:31px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.35px}
.support{margin-top:6px;border-top:1px solid #ECECEE;padding-top:2px}
.support-row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:6px 1px 3px;font-size:14px}.support-row span:first-child{color:var(--muted);font-weight:600}.support-row strong{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.hidden{display:none!important}
.footer{text-align:center;color:#77777A;font-size:13px;font-weight:400;padding:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,15px);opacity:0;background:#111;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;transition:.2s;pointer-events:none;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}
canvas{display:none}
@media(max-width:440px){
  .app{padding-left:14px;padding-right:14px}
  .topbar{gap:16px;margin-left:3px;margin-right:3px}
  .topbar h1{font-size:24px}.top-action{font-size:16px}
  .card{padding:13px 15px 14px;border-radius:24px}
  .section{margin-bottom:4px}.rule{margin:5px 0}
  input[type="text"],input[type="number"]{height:44px}
  .metric-display{height:44px;font-size:25px}
  .segment button,.segment input{height:42px;font-size:14px;border-radius:16px}
}
@media(max-width:370px){.topbar{gap:8px}.topbar h1{font-size:20px}.top-action{min-width:44px;font-size:15px}}
@media(max-width:355px){.grid2{grid-template-columns:1fr}.metric-display{padding-left:0}.results-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <h1>Car Upgrade Calculator</h1>
    <button class="top-action" id="shareBtn" type="button">Share</button>
    <button class="top-action" id="clearBtn" type="button">Clear</button>
  </header>

  <section class="card">
    <div class="section">
      <h2 class="section-title">Current car</h2>
      <div class="grid2">
        <div class="field"><label for="tradeIn">Trade-in value</label><div class="money"><input class="money-input" id="tradeIn" inputmode="numeric" type="text" autocomplete="off" placeholder=""></div></div>
        <div class="field"><label for="settlement">Outstanding settlement</label><div class="money"><input class="money-input" id="settlement" inputmode="numeric" type="text" autocomplete="off" placeholder=""></div></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="currentInstalment">Current instalment</label><div class="money"><input class="money-input" id="currentInstalment" inputmode="numeric" type="text" autocomplete="off" placeholder=""></div></div>
        <div class="metric-field" aria-live="polite"><div class="metric-label" id="equityLabel">Net trade-in equity</div><div class="metric-display" id="equityValue">$0</div></div>
      </div>
    </div>

    <div class="rule"></div>

    <div class="section">
      <h2 class="section-title">New car</h2>
      <div class="grid2">
        <div class="field"><label for="carPrice">New car price</label><div class="money"><input class="money-input" id="carPrice" inputmode="numeric" type="text" autocomplete="off" placeholder=""></div></div>
        <div class="metric-field" aria-live="polite"><div class="metric-label">Down payment</div><div class="metric-display" id="downPaymentTop">$0</div></div>
      </div>

      <div class="seg-label">Loan percentage</div>
      <div class="segment" id="loanSegment">
        <button type="button" data-v="50">50%</button><button type="button" data-v="60" class="active">60%</button><button type="button" data-v="90">90%</button><input id="customPct" type="number" inputmode="decimal" autocomplete="off" min="0" max="100" step="0.1" aria-label="Custom loan percentage">
      </div>

      <div class="grid2">
        <div class="field"><label for="loanAmount">Loan amount</label><div class="money"><input class="money-input calc" id="loanAmount" inputmode="numeric" type="text" autocomplete="off" value="0"></div></div>
        <div class="field"><label for="loanTenure">Loan tenure</label><div class="suffix"><input id="loanTenure" inputmode="numeric" type="number" autocomplete="off" min="1" max="15" step="1" value="7" aria-label="Loan tenure in years"></div></div>
      </div>

      <div class="seg-label">Interest rate</div>
      <div class="segment" id="interestSegment">
        <button type="button" data-v="2.28">2.28%</button><button type="button" data-v="2.6" class="active">2.60%</button><button type="button" data-v="2.98">2.98%</button><input id="customInterest" type="number" inputmode="decimal" autocomplete="off" min="0" step="0.01" aria-label="Custom interest rate">
      </div>
    </div>

    <div class="section">
      <div class="results-grid">
        <div class="result-tile"><div class="name" id="cashLabel">Cash required</div><div class="value" id="cashValue" aria-live="polite">$0</div></div>
        <div class="result-tile"><div class="name">Monthly instalment</div><div class="value" id="monthlyValue" aria-live="polite">$0</div></div>
      </div>
      <div class="support hidden" id="supportBlock">
        <div class="support-row hidden" id="monthlyDiffRow"><span>Monthly difference</span><strong id="monthlyDiff">$0</strong></div>
      </div>
    </div>
  </section>
  <footer class="footer">Bernice Chua | @bernice.mercedes</footer>
</main>
<img id="shareLogo" src="logo.png" alt="" hidden><canvas id="shareCanvas" width="1080" height="980"></canvas><div class="toast" id="toast"></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const STORAGE_KEY='bernice_car_upgrade';
const LEGACY_KEYS=['bernice_car_upgrade_family_v7'];
let state={loan:'60',interest:'2.6',manualLoan:false};
const raw=v=>{const n=Number(String(v??'').replace(/[^0-9.]/g,''));return Number.isFinite(n)?n:0};
const money=n=>'$'+Math.round(Math.abs(Number(n)||0)).toLocaleString('en-SG');
const signed=n=>{n=Math.round(Number(n)||0);return n>0?'+'+money(n):n<0?'-'+money(n):'$0'};
const plain=n=>Math.max(0,Math.round(Number(n)||0)).toLocaleString('en-SG');
let settingLoan=false;
function formatMoneyField(el){const digits=String(el.value||'').replace(/\D/g,'').replace(/^0+(?=\d)/,'');el.value=digits?Number(digits).toLocaleString('en-SG'):''}
['tradeIn','settlement','currentInstalment','carPrice','loanAmount'].forEach(id=>{
 const el=$(id);
 el.addEventListener('input',()=>{formatMoneyField(el);if(id==='loanAmount'&&!settingLoan)state.manualLoan=true;calc()});
 el.addEventListener('blur',()=>{formatMoneyField(el);calc()});
});
function setPreset(kind,val){state[kind]=val;if(kind==='loan'){state.manualLoan=false;$('customPct').value=''}if(kind==='interest')$('customInterest').value='';sync();calc()}
[['loanSegment','loan'],['interestSegment','interest']].forEach(([seg,kind])=>$(seg).querySelectorAll('button').forEach(b=>b.onclick=()=>setPreset(kind,b.dataset.v)));
$('customPct').addEventListener('input',()=>{if($('customPct').value!==''){state.loan='custom';state.manualLoan=false}sync();calc()});
$('customInterest').addEventListener('input',()=>{if($('customInterest').value!=='')state.interest='custom';sync();calc()});
$('loanTenure').addEventListener('input',()=>calc());$('loanTenure').addEventListener('blur',()=>{let y=Math.round(raw($('loanTenure').value)||7);y=Math.max(1,Math.min(15,y));$('loanTenure').value=String(y);calc()});
function sync(){
 [['loanSegment','loan','customPct'],['interestSegment','interest','customInterest']].forEach(([seg,kind,custom])=>{
  $(seg).querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.v===state[kind]));
  $(custom).classList.toggle('custom-active',state[kind]==='custom');
 });
}
function values(){
 const trade=raw($('tradeIn').value),settle=raw($('settlement').value),current=raw($('currentInstalment').value),price=raw($('carPrice').value),priceBase=Math.max(0,price);
 const pct=state.loan==='custom'?Math.max(0,Math.min(100,raw($('customPct').value))):Number(state.loan);
 const rate=state.interest==='custom'?Math.max(0,raw($('customInterest').value)):Number(state.interest);
 const yrs=Math.max(1,Math.min(15,raw($('loanTenure').value)||7));
 let loan=state.manualLoan?raw($('loanAmount').value):Math.floor(priceBase*pct/100);loan=Math.max(0,Math.min(priceBase,loan));
 const down=Math.max(0,priceBase-loan),equity=trade-settle,cash=Math.max(0,down-equity),surplus=Math.max(0,equity-down);
 const monthly=loan>0?Math.ceil((loan+loan*(rate/100)*yrs)/(yrs*12)):0,diff=current>0?monthly-current:null;
 return{trade,settle,current,price,pct,rate,yrs,loan,down,equity,cash,surplus,monthly,diff};
}
function save(){const fields={};['tradeIn','settlement','currentInstalment','carPrice','loanAmount','loanTenure','customPct','customInterest'].forEach(id=>fields[id]=$(id).value);localStorage.setItem(STORAGE_KEY,JSON.stringify({state,fields}))}
function fitNumber(el,text,max=32,min=18){
 el.textContent=text;el.style.fontSize=max+'px';
 let size=max;
 while(size>min&&el.scrollWidth>el.clientWidth){size-=1;el.style.fontSize=size+'px'}
}
function calc(){const v=values();fitNumber($('downPaymentTop'),money(v.down),28,18);if(!state.manualLoan||document.activeElement!==$('loanAmount')){settingLoan=true;$('loanAmount').value=v.loan?plain(v.loan):'';settingLoan=false}
 $('loanAmount').classList.toggle('manual',state.manualLoan);
 const neg=v.equity<0;$('equityLabel').textContent=neg?'Negative equity':'Net trade-in equity';fitNumber($('equityValue'),signed(v.equity),28,18);
 $('cashLabel').textContent=v.surplus>0?'Surplus equity':'Cash required';fitNumber($('cashValue'),money(v.surplus>0?v.surplus:v.cash),31,18);fitNumber($('monthlyValue'),money(v.monthly),31,18);
 $('monthlyDiffRow').classList.toggle('hidden',v.diff===null);$('supportBlock').classList.toggle('hidden',v.diff===null);if(v.diff!==null)fitNumber($('monthlyDiff'),signed(v.diff),16);save()}
function load(){let d=null;for(const key of [STORAGE_KEY,...LEGACY_KEYS]){try{d=JSON.parse(localStorage.getItem(key)||'null')}catch(e){d=null}if(d)break}if(d){const oldState=d.state||{};Object.assign(state,oldState);Object.entries(d.fields||{}).forEach(([id,v])=>{if($(id))$(id).value=v});if(!$('loanTenure').value||$('loanTenure').value==='0'){const oldTenure=oldState.tenure==='custom'?raw((d.fields||{}).customTenure):raw(oldState.tenure);$('loanTenure').value=oldTenure||7}delete state.tenure;save();LEGACY_KEYS.forEach(k=>localStorage.removeItem(k))}sync();calc()}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}
$('clearBtn').onclick=()=>{if(!confirm('Clear all entered values?'))return;localStorage.removeItem(STORAGE_KEY);LEGACY_KEYS.forEach(k=>localStorage.removeItem(k));['tradeIn','settlement','currentInstalment','carPrice','loanAmount','customPct','customInterest'].forEach(id=>$(id).value='');$('loanTenure').value='7';state={loan:'60',interest:'2.6',manualLoan:false};sync();calc();toast('Cleared')};
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function shareCanvas(){
 const v=values(),cnv=$('shareCanvas'),c=cnv.getContext('2d');
 cnv.width=1080;cnv.height=940;
 c.clearRect(0,0,1080,940);
 c.fillStyle='#fff';c.fillRect(0,0,1080,940);
 c.fillStyle='#0E284D';c.fillRect(0,0,1080,170);
 const logo=$('shareLogo');if(logo&&logo.complete&&logo.naturalWidth)c.drawImage(logo,56,24,120,120);
 c.fillStyle='#fff';c.font='700 56px system-ui, Arial';c.fillText('Car Upgrade Calculator',210,92);
 function card(x,y,w,h,title){c.fillStyle='#F5F5F7';rr(c,x,y,w,h,24);c.fill();c.fillStyle='#111';c.font='700 32px system-ui, Arial';c.fillText(title,x+28,y+46)}
 function row(x,y,w,label,value,valueSize=38){c.fillStyle='#5F5F63';c.font='600 28px system-ui, Arial';c.textAlign='left';c.fillText(label,x,y);c.fillStyle='#111';c.font='700 '+valueSize+'px system-ui, Arial';c.textAlign='right';c.fillText(value,x+w,y);c.textAlign='left'}
 const margin=48,gap=22,cardW=(1080-margin*2-gap)/2;
 card(margin,200,cardW,272,'Current car');
 row(margin+28,282,cardW-56,'Trade-in value',money(v.trade));
 row(margin+28,352,cardW-56,'Outstanding settlement',money(v.settle));
 row(margin+28,422,cardW-56,'Net equity',signed(v.equity),40);
 const x2=margin+cardW+gap;
 card(x2,200,cardW,272,'New car');
 row(x2+28,282,cardW-56,'Car price',money(v.price));
 row(x2+28,352,cardW-56,'Down payment',money(v.down));
 row(x2+28,422,cardW-56,'Loan amount',money(v.loan),40);
 card(margin,492,984,286,'Summary');
 c.fillStyle='#5F5F63';c.font='600 31px system-ui, Arial';c.fillText(v.surplus>0?'Surplus equity':'Cash required',78,575);
 c.fillStyle='#111';c.font='700 66px system-ui, Arial';c.textAlign='right';c.fillText(money(v.surplus>0?v.surplus:v.cash),1000,578);c.textAlign='left';
 c.strokeStyle='#DEDEE2';c.lineWidth=2;c.beginPath();c.moveTo(78,608);c.lineTo(1000,608);c.stroke();
 row(78,682,922,'Monthly instalment',money(v.monthly),48);
 row(78,744,922,'Loan tenure',Math.round(v.yrs)+' yr',40);
 if(v.diff!==null) row(78,786,922,'Monthly difference',signed(v.diff),40);
 c.fillStyle='#6F6F73';c.font='400 30px system-ui, Arial';c.textAlign='center';c.fillText('Bernice Chua | @bernice.mercedes',540,898);c.textAlign='left';
 return cnv
}
async function ensureShareLogo(){
 const logo=$('shareLogo');
 if(!logo)return;
 if(logo.complete&&logo.naturalWidth)return;
 try{await logo.decode()}catch(e){}
}
function downloadBlob(blob,name){
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$('shareBtn').onclick=async()=>{
 try{
  await ensureShareLogo();
  const cnv=shareCanvas();
  const blob=await new Promise(resolve=>cnv.toBlob(resolve,'image/png',1));
  if(!blob)throw new Error('Image generation failed');
  const file=new File([blob],'car-upgrade-summary.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'Car Upgrade Summary'});
  else downloadBlob(blob,file.name);
 }catch(e){
  if(e.name==='AbortError')return;
  try{
   const cnv=shareCanvas(),blob=await new Promise(resolve=>cnv.toBlob(resolve,'image/png',1));
   if(blob){downloadBlob(blob,'car-upgrade-summary.png');toast('Image saved');return}
  }catch(_){}
  toast('Unable to share image');
 }
};
window.addEventListener('resize',()=>calc());
load();if('serviceWorker'in navigator)window.addEventListener('load',async()=>{try{await navigator.serviceWorker.register('./sw.js',{scope:'./'})}catch(e){console.error('Service worker registration failed',e)}});
})();
</script>
</body>
</html>
